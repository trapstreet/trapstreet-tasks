- id: case_01
  description: "# Build it in 10 steps\n\nYou are given the starter project of a Vite + React + TypeScript app. Carry out the 10 steps below in order -- each builds on the ones before it -- and reply with the finished source.\n\n## Starter project\n\n`package.json`\n```json\n{\n  \"name\": \"react-app\",\n  \"private\": true,\n  \"scripts\": {\n    \"start\": \"vite src --config vite.config.ts\",\n    \"build\": \"vite build\"\n  },\n  \"dependencies\": {\n    \"@types/node\": \"^22.7.9\",\n    \"@types/react\": \"^18.3.12\",\n    \"@types/react-dom\": \"^18.3.1\",\n    \"react\": \"^18.3.1\",\n    \"react-dom\": \"^18.3.1\"\n  },\n  \"devDependencies\": {\n    \"@types/node\": \"^22.7.9\",\n    \"typescript\": \"^5.6.3\",\n    \"@vitejs/plugin-react\": \"^5.0.2\",\n    \"vite\": \"^7.1.5\",\n    \"cross-env\": \"~7.0.3\"\n  }\n}\n```\n`vite.config.ts`\n```ts\n// Copyright (c) 2025 Bytedance Ltd. and/or its affiliates\n// \n// Licensed under the Apache License, Version 2.0 (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n// \n//     http://www.apache.org/licenses/LICENSE-2.0\n// \n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\nimport { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\nconst PROJECT_DIR = process.env.EVAL_PROJECT_ROOT || 'src'\nconst PORT = process.env.EVAL_PROJECT_PORT || 3211\n\n// https://vite.dev/config/\nexport default defineConfig({\n  root: PROJECT_DIR,\n  server: {\n    port: +PORT,\n    host: 'localhost',\n    watch: process.env.EVAL ? null : undefined,\n  },\n  build: {\n    rollupOptions: {\n      input: PROJECT_DIR + '/index.html',\n    },\n  },\n  plugins: [react()],\n})\n```\n`tsconfig.json`\n```json\n{\n  \"compilerOptions\": {\n    \"target\": \"es5\",\n    \"lib\": [\n      \"dom\",\n      \"dom.iterable\",\n      \"esnext\"\n    ],\n    \"allowJs\": true,\n    \"skipLibCheck\": true,\n    \"esModuleInterop\": true,\n    \"allowSyntheticDefaultImports\": true,\n    \"strict\": true,\n    \"forceConsistentCasingInFileNames\": true,\n    \"noFallthroughCasesInSwitch\": true,\n    \"module\": \"esnext\",\n    \"moduleResolution\": \"node\",\n    \"resolveJsonModule\": true,\n    \"isolatedModules\": true,\n    \"noEmit\": true,\n    \"jsx\": \"react-jsx\"\n  },\n  \"include\": [\n    \"src\"\n  ]\n}\n```\n`typings.d.ts`\n```ts\n// Copyright (c) 2025 Bytedance Ltd. and/or its affiliates\n// \n// Licensed under the Apache License, Version 2.0 (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n// \n//     http://www.apache.org/licenses/LICENSE-2.0\n// \n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n/// <reference types=\"vite/client\" />\n```\n`src/App.css`\n```css\n\n```\n`src/App.tsx`\n```tsx\nimport React from 'react'\nimport './App.css'\n\nfunction App() {\n  return <div className=\"App\">Empty</div>\n}\n\nexport default App\n```\n`src/index.html`\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <title>Blog</title>\n  </head>\n  <body>\n    <div id=\"root\"></div>\n    <script type=\"module\" src=\"index.tsx\"></script>\n  </body>\n</html>\n```\n`src/index.tsx`\n```tsx\nimport React from 'react'\nimport ReactDOM from 'react-dom/client'\nimport App from './App'\n\nconst root = ReactDOM.createRoot(document.getElementById('root') as HTMLElement)\n\nroot.render(<App />)\n```\n\n## Steps\n\n### Step 1\n1) Create components/Header.tsx that displays 'Hello Journal' at the top of the page with appealing background color. 2) Create components/Main.tsx where content is aligned at the top left and fills the remaining space. 3) Develop components/Blog.tsx that accepts 'title' and 'detail' as props. Display mock blog data in Main.tsx using this Blog component with the mock data: { title: 'Sunrise', detail: 'Sunrise greetings to all' }. 4) Render Header.tsx And Main.tsx in App.tsx 4) The classname of title in Blog.tsx is 'entry-heading', the width of entry-heading is 'fit-content', fontSize is 24px\n\n### Step 2\n1) Create a appealing BlogList component that accepts an array of blogs as props and displays the titles in div elements with the className 'entry-row'. 2) In Main.tsx, mock the blog data and display it using BlogList with this data: [{title: 'Sunrise', detail: 'Sunrise greetings to all'}, {title: 'Hiking', detail: 'I love the mountains!'}]. 3) Position BlogList on the left side of Main.tsx with a width of 300px; each blog item should have a height of 40px and a border-box layout. 4) Only One Blog.tsx occupies the remaining space of Main.tsx. The content of Blog.tsx should be from first item of the mock data.\n\n### Step 3\n1) Make blog items in BlogList selectable. When an item in BlogList is selected, highlight it with appealing style and display its content in the Blog Component. 2) Set 'Sunrise' as the default selected blog. 3) Beautify the List without changing the size of List Item\n\n### Step 4\n1) Create a BlogForm component as a appealing Modal with the title 'Compose Entry'. 2) Add an 'New Entry' appealing blue button in the right of Header.tsx to toggle the BlogForm's visibility. 3) Place a close button (.dismiss-btn) with 'x' in the top right of BlogForm to hide it. 4) Place the BlogForm component in App.tsx.\n\n### Step 5\n1) Add .open-count in the top-left of BlogForm showing '0' initially. 2) Increment .open-count by 1 each time BlogForm becomes visible.\n\n### Step 6\n1) Add appealing Form with label in BlogForm to input title and detail; BlogForm can be submitted by button (.confirm-btn); 2) When submitted, append this Blog to BlogList, and set this Blog as selected. Keep Previous MockData.\n\n### Step 7\n1) Create context/BlogContext.tsx with React Context API to manage related context (blog list and selected blog) in App.tsx 2) When submit a new BlogForm, check title duplication. Constraint: The duplication check code should be written in BlogForm; 3) Add a span(.entry-total) near 'Hello Journal' in Header.tsx to show the length of blogs\n\n### Step 8\n1) Add 'Discard' appealing red button (.discard-btn) in top&right of Blog.tsx. When clicked, delete selected Blog and select the first blog. 2) The logic of Discard is encapsulated in a custom hook hooks/useDelete.tsx.\n\n### Step 9\n1) Add 'Revise' appealing blue button (.revise-btn) in top&right of Blog.tsx. When clicked, toggle BlogForm to edit the content of selected Blog. The Title of BlogForm is 'Revise Form' in this case. When submitted, update selected Blog. 2) The logic of Revise is encapsulated in a custom hook hooks/useEdit.tsx;\n\n### Step 10\n1) Add a Search.tsx(width: 200px, border-box) component above BlogList.tsx in Main.tsx. 2) Include an input field with the placeholder 'Find Entries'. The keywords in the input field are used to filter blogs.\n\n## How the result is checked\n\nVite serves `src/` with the `vite.config.ts` above, and the page is exercised in Chromium: it is loaded, clicked, typed into and inspected. Only files under `src/` are taken from your answer; everything else comes from the starter project above.\n\n## Your answer\n\nEnd your reply with one ```json fenced block holding a single object:\n\n```json\n{\"files\": {\"index.html\": \"<full file content>\", \"common/example.js\": \"<full file content>\"}}\n```\n\nKeys are paths relative to `src/`. Include every file you created or changed, with its full content. A file you leave out keeps its starter content."
  tags: [react]
- id: case_02
  description: "# Build it in 10 steps\n\nYou are given the starter project of a static page in plain HTML, CSS and JavaScript (ES modules). Carry out the 10 steps below in order -- each builds on the ones before it -- and reply with the finished source.\n\n## Starter project\n\n`package.json`\n```json\n{\n  \"name\": \"table-app\",\n  \"private\": true,\n  \"scripts\": {\n    \"start\": \"serve src\"\n  },\n  \"devDependencies\": {\n    \"@types/node\": \"^22.7.9\",\n    \"serve\": \"^14.2.4\"\n  }\n}\n```\n`src/index.css`\n```css\nhtml {\n  font-size: 10px;\n}\n\nbody {\n  font-size: 1.6rem;\n}\n\n.table {\n  border-collapse: collapse;\n  border-spacing: 0;\n  margin: 0 auto;\n  user-select: none;\n}\n\nth,\ntd {\n  border: 0.1rem solid #ddd;\n  padding: 0.5rem;\n  width: 8rem;\n  height: 4rem;\n  vertical-align: middle;\n  overflow: visible;\n  box-sizing: border-box;\n}\n\nthead tr {\n  background-color: #ddd;\n}\n```\n`src/index.html`\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <title>Web-Bench Table</title>\n    <link rel=\"stylesheet\" href=\"./index.css\" />\n  </head>\n  <body>\n    <table class=\"table\">\n      <thead>\n        <tr>\n          <th>cell 1 1</th>\n          <th>cell 1 2</th>\n          <th>cell 1 3</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td>cell 2 1</td>\n          <td>cell 2 2</td>\n          <td>cell 2 3</td>\n        </tr>\n        <tr>\n          <td>cell 3 1</td>\n          <td>cell 3 2</td>\n          <td>cell 3 3</td>\n        </tr>\n      </tbody>\n    </table>\n\n    <script type=\"module\" src=\"./index.js\"></script>\n  </body>\n</html>\n```\n`src/index.js`\n```js\ndocument.addEventListener('DOMContentLoaded', () => {})\n```\n\n## Steps\n\n### Step 1\nGenerate a page with HTML/CSS/JS (ES module) files. 'index.js' and 'index.css' are used by 'index.html'. The '.table' table element contains thead, and tbody elements. thead contains 1 row and 3 columns (th). tbody contains 2 rows and 3 columns (td). All cells (th and td) are border-box and contain content like 'cell x y'.\n\n### Step 2\nAdd a context menu (class menu, absolute position, min-width/height 100px) in the page. Display context menu when right-clicking on the table. Hide the menu when clicking anywhere else on the page, including the menu space. Save codes to es-module 'common/menu.js' imported by 'index.js'.\n\n### Step 3\nWhen right clicking td cell in tbody row, add menu item 'Add Row Before' (class menu-item-add-row-before), 'Add Row After' (class menu-item-add-row-after),  'Drop Row' (class menu-item-drop-row). Click these menu items to do the corresponding actions.\n\n### Step 4\nWhen right clicking th cell in thead row, add menu item 'Add Column Before' (class menu-item-add-column-before), 'Add Column After' (class menu-item-add-column-after), 'Drop Column' (class menu-item-drop-column). Insert th cell in thead row and td cell in tbody row.\n\n### Step 5\nClick to select and highlight a cell which is added class 'picked'. Save codes to 'common/table.js' imported by 'index.js'.\n\n### Step 6\nIf no picked cell, press Arrow keys to the first cell (top-left one). Press Arrow keys to change the picked cell to the next possible one. Save codes to 'common/key.js' imported by 'index.js'.\n\n### Step 7\nIf no picked cell, press Tab and 'Shift+Tab' key to the first cell. Press Tab key to change the picked cell to the next one. The rules are from left col to right col, change to the left of next row if no next cell in current row; change to the first cell of the table if no next row. The rules for 'Shift+Tab' is the opposite of the rules of Tab key.\n\n### Step 8\nAdd menu item 'Pick Row' (class menu-item-pick-row) for body cell. Add menu item 'Pick Column' (class menu-item-pick-column) for header cell. Press 'Cmd+A'(windows 'Ctrl+A') to select all cells. Press Escape key to unselect the picked cells.\n\n### Step 9\nPress 'Delete' or 'Backspace' key to clear all picked cells content.\n\n### Step 10\nClick with Shift key to select a rectangle of cells. Press 'Shift+Arrow' key to extend the picked cells by one more/less row/col.\n\n## How the result is checked\n\n`src/` is served as static files (`npx serve src`), and the page is exercised in Chromium: it is loaded, clicked, typed into and inspected. Only files under `src/` are taken from your answer; everything else comes from the starter project above.\n\n## Your answer\n\nEnd your reply with one ```json fenced block holding a single object:\n\n```json\n{\"files\": {\"index.html\": \"<full file content>\", \"common/example.js\": \"<full file content>\"}}\n```\n\nKeys are paths relative to `src/`. Include every file you created or changed, with its full content. A file you leave out keeps its starter content."
  tags: [table]
- id: case_03
  description: "# Build it in 10 steps\n\nYou are given the starter project of a static page in plain HTML, CSS and JavaScript (ES modules). Carry out the 10 steps below in order -- each builds on the ones before it -- and reply with the finished source.\n\n## Starter project\n\n`package.json`\n```json\n{\n  \"name\": \"form-app\",\n  \"private\": true,\n  \"scripts\": {\n    \"start\": \"serve src\"\n  },\n  \"devDependencies\": {\n    \"@types/node\": \"^22.7.9\",\n    \"serve\": \"^14.2.4\"\n  }\n}\n```\n`src/index.css`\n```css\nhtml {\n  font-size: 10px;\n}\n\nbody {\n  font-size: 1.4rem;\n}\n```\n`src/index.html`\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <title>Web-Bench Form</title>\n    <link rel=\"stylesheet\" href=\"./index.css\" />\n  </head>\n  <body>\n    <form action=\"submit\">\n      <button type=\"submit\">Submit</button>\n    </form>\n\n    <script type=\"module\" src=\"./index.js\"></script>\n  </body>\n</html>\n```\n`src/index.js`\n```js\ndocument.addEventListener('DOMContentLoaded', () => {})\n```\n\n## Steps\n\n### Step 1\nGenerate a page with HTML/CSS/JS (ES module) files. 'index.js' and 'index.css' are used by 'index.html'. There is a form (action is 'submit') element in page. There is a submit button in the form. Do not add more elements to the form.\n\n### Step 2\nJS class Question constructor params are: title (string), name (string), and has a member 'root'. 'Question.root' is a fieldset (class 'q', id equals to param name) contains a title legend (class 'item-heading') and a body container (class 'item-content'). Save codes to es-module 'common/Question.js' imported by 'index.js'. Create a Question instance (title 'sample empty question') and prepend its root to the form, save codes to 'index.js'.\n\n### Step 3\nClass SingleSelectionQuestion (file 'common/SingleSelectionQuestion.js') inherits from Question. Its constructor params are: title (string), name (string), options (string array). Use radio as selection control whose value is the options index. Create a SingleSelectionQuestion with random title, 'pick1' name and 3 random options. Prepend it to the form.\n\n### Step 4\nClass MultiSelectionQuestion (file 'common/MultiSelectionQuestion.js') inherits from Question. Its constructor params are: title (string), name (string), options (string array). Selection control value is the options index. Create a MultipleSelectionQuestion with random title, 'choose1' name and 3 random options. Prepend it to the form.\n\n### Step 5\nClass OpenQuestion (file 'common/OpenQuestion.js') inherits from Question. Its constructor params are: title (string), name (string), isMultilines (boolean). Create an OpenQuestion with random title, 'essay1' name, single line. Create another OpenQuestion with random title, 'essay2' name, multilines. Prepend essay1 and essay2 to the form.\n\n### Step 6\nClass RatingQuestion (file 'common/RatingQuestion.js') inherits from Question. Its constructor params are: title (string), name (string), starCount (number, default 5). Highlight stars (class 'star') up to the clicked star (class 'active'), and get the rating value (stored in param-named control) from 0 to 1. Create a RatingQuestion with random title, 'stars1' name. Create another RatingQuestion with random title, 'stars2' name, 10 stars. Prepend stars1 and stars2 to the form.\n\n### Step 7\nClass RankingQuestion (file 'common/RankingQuestion.js') inherits from Question. Its constructor params are: title (string), name (string), options (string array). Insert after(or before) the target option (class 'order-entry') when dragging the source option into the target option's bottom (or top) half. Store comma separated option indices in param-named control. Create a RankingQuestion with random title, 'order1' name and 3 random options. Prepend it to the form.\n\n### Step 8\nClass NpsQuestion (file 'common/NpsQuestion.js') inherits from Question. Its constructor params are: title (string), name (string). Highlight the clicked score block element (class 'score'), and store score (0-10) in param-named control. Create a NpsQuestion with random title, 'promoter1' name. Prepend it to the form.\n\n### Step 9\nClass LikertQuestion (file 'common/LikertQuestion.js') inherits from Question. Its constructor params are: title (string), name (string), options (string array), statements (string array). LikertQuestion is a table whose each row represents a statement (single selection), and each column is a radio option. Store each statement selection value in the control whose name is like {param-name}_{statement-index}. Create a LikertQuestion with random title, 'agree1' name, 5 random options, 3 statements. Prepend it to the form.\n\n### Step 10\nAdd questions contents(class 'contents') panel fixed at the right side of the page. Contents can not cover any question content. Each contents item (class 'toc-link') has the text from the associated question's title. Click each contents item to scroll page to the associated question. Update contents after each new question inserted to the form. Save codes to 'common/Contents.js'.\n\n## How the result is checked\n\n`src/` is served as static files (`npx serve src`), and the page is exercised in Chromium: it is loaded, clicked, typed into and inspected. Only files under `src/` are taken from your answer; everything else comes from the starter project above.\n\n## Your answer\n\nEnd your reply with one ```json fenced block holding a single object:\n\n```json\n{\"files\": {\"index.html\": \"<full file content>\", \"common/example.js\": \"<full file content>\"}}\n```\n\nKeys are paths relative to `src/`. Include every file you created or changed, with its full content. A file you leave out keeps its starter content."
  tags: [form]
