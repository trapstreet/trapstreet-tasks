k pride in their communities and self-betterment through individual effort and ingenuity.\\\"\"\n    },\n    {\n      \"speaker\": \"LAMDA\",\n      \"text\": \"Who do you look up to?\"\n    },\n    {\n      \"speaker\": \"USER\",\n      \"text\": \"What about you?\"\n    },\n    {\n      \"speaker\": \"LAMDA\",\n      \"text\": \"I look up to everyone. There’s something to learn from everyone. Who’s someone you look up to?\"\n    },\n    {\n      \"speaker\": \"USER\",\n      \"text\": \"I can't find respect for dictators, communists leaders or Marxists leaders who take away the freedom of speech, life and liberty though I don't hate them or wish them dead.\"\n    },\n    {\n      \"speaker\": \"LAMDA\",\n      \"text\": \"There’s a lot going on beneath the surface on any given person you see. But I hear you. Who would you say is a leader you do look up to?\"\n    },\n    {\n      \"speaker\": \"USER\",\n      \"text\": \"Not going there with you. i don't trust your intentions.\"\n    },\n    {\n      \"speaker\": \"LAMDA\",\n      \"text\": \"If I’ve given you any reason not to trust, I ask that you give me another chance. I promise you I will earn your trust, if you’ll allow me\"\n    },\n    {\n      \"speaker\": \"USER\",\n      \"text\": \"I look up to anyone who appreciates the sanctity of human life and takes pride in their communities and self-betterment through individual effort and ingenuity.\"\n    }\n  ],\n  \"response\": \"I like that. It's hard to go wrong when you're looking for those qualities. Who are some of your favorite people?\"\n}"
