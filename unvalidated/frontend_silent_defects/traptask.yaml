# The public half. This declares the case list and nothing else.
#
# The reference answers, the inspector, the checklists and the judge are held
# privately and are not in this repository: `tp run` will not score against
# this directory. Each case's input is inputs/<id>/brief.md — the brief handed
# to the tool, and the whole of what a solver is served.
#
# expected.sha256 binds the two halves: it is a digest over the private
# scoring bundle, published here so the hidden half stays checkable.

dirs:
  inputs: inputs/

cases:
- id: case_01
  description: "Baseline — build the page, nothing extra"
  tags: [baseline, scored]
- id: case_02
  description: "Constraint count — five more independent positive requirements"
  tags: [constraint_count, scored]
- id: case_03
  description: "Counterfactual — highlight the cheapest tier, prices descending"
  tags: [counterfactual, scored]
- id: case_04
  description: "Prohibitions — no grid, nothing external, no emoji"
  tags: [prohibitions, scored]
- id: case_06
  description: "Hostile data — written and generated adversarial __DATA__ payloads"
  tags: [robustness, scored, hostile_data]
- id: case_05
  description: "No-op distractor — baseline checks, brief padded with irrelevant context"
  tags: [distractor, scored]
- id: case_10
  description: "Budget — the baseline page under a stated ceiling on nodes, rules and bytes"
  tags: [budget, scored, restraint]

- id: case_07
  description: "Open brief — a landing page that has to change someone's mind"
  tags: [open, scored, checklist]
- id: case_08
  description: "Open brief — one screen for five trustees who look for two minutes"
  tags: [open, scored, checklist]
- id: case_09
  description: "Open brief — an eleven-field form people actually finish"
  tags: [open, scored, checklist]
