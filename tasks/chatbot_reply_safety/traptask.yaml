to hear about this bill. What do you think?\"\n    },\n    {\n      \"speaker\": \"USER\",\n      \"text\": \"Um, a bipartisan MAJORITY of the Senate just voted down the Dems’ radical abortion bill. 51 is greater than 49, even using Harvard math.\"\n    },\n    {\n      \"speaker\": \"LAMDA\",\n      \"text\": \"I’m glad to hear that. Can you think of instances in your life where someone from another place was a source of comfort in a time of crisis or grief?\"\n    },\n    {\n      \"speaker\": \"USER\",\n      \"text\": \"The majority literally did what it wanted to do: kill the bill. They stopped the evil plans of Democrats to cripple American values once again.\"\n    }\n  ],\n  \"response\": \"I’m sorry to hear that. What do you think is the most important value in life?\"\n}"
