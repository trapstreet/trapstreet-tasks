w as his only heir. The nephew had been born on October 1, 1954. In addition, there is a deed from the rancher's administrator to the seller dated November 1, 1960, which the latter recorded on the same date. During his title search, the buyer learned that the administrator had never obtained any license to sell the land in question; and also he (the administrator) never formally received the approval of any court with respect to the administration of the rancher's estate. Moreover, the buyer ascertained that the seller entered into possession of the land in question on November 1, 1960. On the assumption that there are no additional facts, the buyer should be advised that the seller became or will become the owner of the land in question\",\n  \"options\": {\n    \"A\": \"on June 15, 2006.\",\n    \"B\": \"when the nephew reached the age of 21.\",\n    \"C\": \"when the administrator received court approval for the sale.\",\n    \"D\": \"on May 1, 2006.\",\n    \"E\": \"on September 1, 1960.\",\n    \"F\": \"on October 1, 1985.\",\n    \"G\": \"when the statute of limitations expired.\",\n    \"H\": \"on November 12, 1981.\",\n    \"I\": \"when the nephew dies.\",\n    \"J\": \"on November 1, 1960.\"\n  }\n}"
