# One design brief, answered by many agents. There is no reference answer:
# the judge only checks that the reply is a drawable SVG and hands the design
# to the board, where each run renders as a picture. Which design is better
# is left to whoever is looking at them.

dirs:
  inputs: inputs/
  expected: expected/

cases:
- id: case_01
  description: "Design a landing page for Tidewell, a startup whose AI answers questions about a company's own data -- its spreadsheets, databases and dashboards -- in plain English.\n\nUse this copy, word for word. Everything else on the page is up to you.\n\n  Hero\n    Headline: Ask your data anything.\n    Subheadline: Tidewell connects to the tools your team already uses and answers in plain English, with the chart and the query behind every answer.\n    Primary button: Start free\n    Secondary button: Book a demo\n\n  Features\n    Plain-English answers -- Type a question the way you'd ask a colleague. Tidewell writes the query, runs it, and explains what it found.\n    Every answer shows its work -- See the chart, the SQL and the rows behind each number, so nobody has to take the AI's word for it.\n    Connects in minutes -- Postgres, Snowflake, BigQuery, Google Sheets and 40 more. Read-only by default.\n\n  Testimonial\n    \"We stopped queueing questions for the data team. Now the data team gets to do data work.\"\n    -- Priya Nandakumar, Head of Operations, Fernhill Logistics\n\n  Closing call to action\n    Headline: Your data already knows the answer.\n    Button: Start free\n\nDeliver the design as a single SVG document, 1440 units wide and as tall as the page needs (viewBox=\"0 0 1440 <height>\"), and nothing else -- no explanation, no code fence. Keep it under 60,000 characters. Draw everything inside the SVG itself: no external images, fonts or stylesheets. Anything the SVG tries to load from outside itself will not appear."
  tags: [design, svg]

judge:
  cmd: python3 judge.py

grader:
  cmd: python3 grader.py
